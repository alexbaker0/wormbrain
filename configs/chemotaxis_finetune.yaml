# Chemotaxis task v3, fine-tuning: the rules of chemotaxis_straight2.yaml (straight
# crawling required, measured per mm; movement measured as net progress), but the
# chemotaxis stage starts from each graph's milestone-6 brain (which already steers by
# smell, in drifting loops) instead of from a crawling-only brain. Same for every graph.

condition: real          # real | rewired | random | sign_shuffled | weight_shuffled
glutamate: excitatory    # excitatory | inhibitory (both are run; see README)
seed: 0
bounded: true            # parameter ranges limited (see src/wormbrain/brain.py BOUNDS)
activation: tanh         # neuron output curve; sigmoid let no salt signal through

env: [configs/env.yaml]
env_overrides:
  start: {distance: [4.0, 8.0]}     # mm from food
  episode: {duration: 90.0, dt: 0.02}   # 0.02 s: see README for the accuracy cost
  reward:
    type: concentration_gain
    final_fraction: 1.0    # mean over the whole episode minus the start: rewards getting there fast
    energy_weight: 0.05
    min_speed: 0.1         # mm/s; slower than this is penalised (worms keep crawling)
    idle_penalty: 0.5
    speed_measure: progress  # net displacement over 5 s windows

straightness:            # penalty = weight x (mean |turning| per mm on a flat field - threshold)
  measure: per_mm
  weight: 0.006          # per deg/mm; a 1 mm-radius circle (57 deg/mm) costs 0.25
  threshold_deg_mm: 15.0 # curves wider than about 4 mm radius are free
  n_headings: 2
  duration: 60.0
  dt: 0.02

init_from: reports/comparison/runs   # start from the milestone-6 trained brain

stage1:                  # crawling; unchanged from chemotaxis.yaml
  generations: 100
  popsize: 24
  sigma0: 0.5

stage2:                  # chemotaxis fine-tuning
  generations: 100
  popsize: 24
  sigma0: 0.2
  n_starts: 8            # random starts per candidate per generation, shared by all candidates

evaluation:
  n_starts: 32
  validation_seed: 500
  test_seed: 1000
  arenas:                # the training arena first; the rest are never seen in training
    gaussian: {env: [configs/env.yaml]}
    far_start:
      env: [configs/env.yaml]
      overrides: {start: {distance: [8.0, 10.0]}, episode: {duration: 150.0, dt: 0.02}}
    two_peaks: {env: [configs/env.yaml, configs/env_two_peaks.yaml]}
    linear: {env: [configs/env.yaml, configs/env_linear.yaml]}
