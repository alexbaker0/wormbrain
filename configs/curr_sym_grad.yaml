# Curriculum, step 1 of 2 (symmetric body (tied D/V motor classes)): learn to crawl, then to steer up a broad
# smell gradient. Both curriculum models have head proprioception (SMD/RMD sense head
# bending) and the back/belly offset; they differ only in dv_tie. Step 2 is
# curr_sym_patch.yaml (the patch world, food eaten - energy).
# Gradient stage: one Gaussian food source (sigma 4 mm, smelled across the arena), starts
# 4-8 mm away, 120 s; reward = mean concentration over the trial - energy, with the usual
# keep-moving rule (dropped again in step 2).

condition: real
glutamate: excitatory
seed: 0
bounded: true
activation: tanh
muscle_dv: true
dv_tie: true
head_proprio: true

env: [configs/env.yaml]
env_overrides:
  start: {distance: [4.0, 8.0]}
  episode: {duration: 120.0, dt: 0.02}
  reward:
    type: concentration_gain
    final_fraction: 1.0
    energy_weight: 0.05
    min_speed: 0.1
    idle_penalty: 0.5
    speed_measure: progress

stage1:
  generations: 100
  popsize: 24
  sigma0: 0.5

stage2:
  generations: 120
  popsize: 24
  sigma0: 0.3
  n_starts: 8

evaluation:
  n_starts: 32
  validation_seed: 500
  test_seed: 1000
  arenas:
    gaussian: {env: [configs/env.yaml]}
    far_start:
      env: [configs/env.yaml]
      overrides:
        start: {distance: [8.0, 10.0]}
        episode: {duration: 150.0, dt: 0.02}
