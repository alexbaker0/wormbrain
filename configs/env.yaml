# Body, arena and episode used by every experiment unless a run config overrides it.
# Units: mm and seconds.

body:
  length: 1.0            # adult hermaphrodite, ~1 mm
  n_segments: 16
  drag_tangential: 1.0
  drag_normal: 20.0      # sideways/lengthwise drag ratio; large on agar (assumption, see README)
  kappa_max: 8.0         # 1/mm at full one-sided activation
  tau_muscle: 0.1        # s

field:
  type: gaussian         # gaussian | peaks | linear
  peak: [0.0, 0.0]
  sigma: 4.0             # mm
  amplitude: 1.0

start:
  distance: [4.0, 6.0]   # mm from the first peak; heading uniform at random

episode:
  duration: 120.0        # s
  dt: 0.01               # s

reward:
  type: concentration_gain   # concentration_gain | final_distance
  final_fraction: 0.1
  energy_weight: 0.0
