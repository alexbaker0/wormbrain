# Lasting-food round, phase 1 of 3: screening (OBJECTIVES.md section 7). Many brains, few
# generations, food close by (2-5 mm) so a brain that only crawls sometimes finds it.
# Food lasts (capacity 4 = 80 s of eating, was 20 s). Score: food eaten + credit for
# getting closer - a small energy price, as in forage_ens. The approach credit is a search
# aid only: without it a crawl-only brain eats nothing, pays for moving, and learns to
# freeze (checked before this round). It is dropped in phase 3. The gait stage is shared
# with forage_ens.

condition: real
glutamate: excitatory
seed: 0
bounded: true
activation: tanh
muscle_dv: true
dv_tie: true
head_proprio: true
food_sense: true

stage1_from: runs/chemotaxis/forage_ens

env: [configs/env.yaml]
env_overrides:
  field: {type: forage, shape: cone, reach: 10.0, steepness: [0.3, 3.0], capacity: 4.0,
          eat_radius: 1.0, eat_rate: 0.05, respawn: [2.0, 5.0]}
  start: {}
  episode: {duration: 240.0, dt: 0.02}
  reward: {type: forage, approach_weight: 1.0, energy_weight: 0.2}

stage1:
  generations: 100
  popsize: 24
  sigma0: 0.5
  objective: gait
  target_speed: 0.22
  duration: 60.0

stage2:
  generations: 30
  popsize: 24
  sigma0: 0.3
  n_starts: 8

evaluation:
  n_starts: 32
  validation_seed: 500
  test_seed: 1000
  arenas:
    forage: {env: [configs/env.yaml]}
    gaussian:
      env: [configs/env.yaml]
      overrides:
        field: {type: gaussian, peak: [0.0, 0.0], sigma: 4.0, amplitude: 1.0}
        start: {distance: [4.0, 8.0]}
        episode: {duration: 90.0, dt: 0.02}
        reward: {type: concentration_gain, final_fraction: 1.0, energy_weight: 0.05}
