# Chemotaxis training: crawling stage, then chemotaxis stage, then held-out tests.
# condition / glutamate / seed are usually set on the command line.

condition: real          # real | rewired | random | sign_shuffled | weight_shuffled
glutamate: excitatory    # excitatory | inhibitory (both are run; see README)
seed: 0
bounded: true            # parameter ranges limited (see src/wormbrain/brain.py BOUNDS)
activation: tanh         # neuron output curve; sigmoid let no salt signal through

env: [configs/env.yaml]
env_overrides:
  start: {distance: [3.0, 5.0]}     # mm from food
  episode: {duration: 90.0, dt: 0.02}   # 0.02 s: see README for the accuracy cost
  reward:
    type: concentration_gain
    final_fraction: 0.5    # mean over the second half minus the start: less noisy than the end alone
    energy_weight: 0.05
    min_speed: 0.1         # mm/s; slower than this is penalised (worms keep crawling)
    idle_penalty: 0.5

stage1:                  # crawling; same settings as the locomotion study so runs are reused
  generations: 100
  popsize: 24
  sigma0: 0.5

stage2:                  # chemotaxis
  generations: 150
  popsize: 24
  sigma0: 0.3
  n_starts: 8            # random starts per candidate per generation, shared by all candidates

evaluation:
  n_starts: 32
  validation_seed: 500
  test_seed: 1000
  arenas:                # the training arena first; the rest are never seen in training
    gaussian: {env: [configs/env.yaml]}
    far_start:
      env: [configs/env.yaml]
      overrides: {start: {distance: [6.0, 8.0]}, episode: {duration: 135.0, dt: 0.02}}
    two_peaks: {env: [configs/env.yaml, configs/env_two_peaks.yaml]}
    linear: {env: [configs/env.yaml, configs/env_linear.yaml]}
